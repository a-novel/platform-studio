name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to cut
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump and report only
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

run-name: "🚀 release ${{ inputs.release_type }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.core.outputs.tag }}
      version: ${{ steps.core.outputs.version }}
    steps:
      - id: core
        uses: a-novel-kit/workflows/publish-actions/release-core@v1.29.0
        with:
          cli_version: "1.9.1"
          release_type: ${{ inputs.release_type }}
          dry_run: ${{ inputs.dry_run }}
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}

  build-platform:
    needs: [release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.29.0
        with:
          file: Dockerfile
          image_name: ${{ github.repository }}
          version: ${{ needs.release.outputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  archive:
    needs: [release, build-platform]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.29.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
