name: storybook

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-storybook:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    steps:
      - id: publish
        uses: a-novel-kit/workflows/github-pages-actions/publish-storybook@de35fd0061ce63c0184738d50dd3367ba5c0fb4b
        with:
          build_action: build:storybook
          build_path: storybook-static
          working_directory: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
