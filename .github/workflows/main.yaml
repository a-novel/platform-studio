name: main

on:
  merge_group:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  lint-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.33.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          lint_action: "lint:ci"

  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/generic-actions/lint-dockerfile@v1.33.0
        with:
          version: "2.14.0"

  test-unit:
    needs: [lint-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.33.0
        id: test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          test_action: "test:unit"
          coverage_artifact: unitcover
          coverage_file: coverage/unit/lcov.info

  test-browser:
    needs: [lint-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
      statuses: write
      id-token: write
    env:
      COMPOSE_PROJECT_NAME: studio-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-playwright@v1.33.0
        id: test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          compose_file: builds/compose.e2e.yaml
          report_artifact: studio-browser-report
          drive_ci_provider: ${{ vars.VISUAL_CI_PROVIDER }}
          drive_ci_account: ${{ vars.VISUAL_CI_ACCOUNT }}
          drive_maintenance_provider: ${{ vars.VISUAL_MAINTENANCE_PROVIDER }}
          drive_maintenance_account: ${{ vars.VISUAL_MAINTENANCE_ACCOUNT }}
          references_folder: ${{ vars.VISUAL_REFERENCES_FOLDER }}
          results_folder: ${{ vars.VISUAL_RESULTS_FOLDER }}
          seed_sha: ${{ vars.VISUAL_SEED_SHA }}

  test-storybook:
    needs: [lint-node]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.33.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
      - name: Run Storybook interaction and accessibility tests
        run: pnpm run test:storybook

  report-codecov:
    runs-on: ubuntu-latest
    needs: [test-unit, test-browser]
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.33.0
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          coverage_files: unitcover/lcov.info,browsercover/lcov.info
          coverage_artifact_ids: ${{ needs.test-unit.outputs.artifact-id }},${{ needs.test-browser.outputs.artifact-id }}

  audit-node:
    needs: [lint-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.33.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
      - name: Audit production and development dependencies
        run: pnpm run audit

  build-node:
    needs: [lint-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.33.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          build_action: "build:ci"

  build-platform:
    needs: [lint-dockerfile, build-node]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.33.0
        with:
          file: Dockerfile
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  inspect-visual-folder-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/232403541574/locations/global/workloadIdentityPools/github-actions/providers/studio-visual-ci
          service_account: ${{ vars.VISUAL_CI_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
          export_environment_variables: false
      - name: Inspect candidate folder metadata
        env:
          DRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
          REFERENCES_FOLDER: ${{ vars.VISUAL_REFERENCES_FOLDER }}
          RESULTS_FOLDER: ${{ vars.VISUAL_RESULTS_FOLDER }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const folders = [];
          for (const id of [process.env.REFERENCES_FOLDER, process.env.RESULTS_FOLDER]) {
            const url = new URL(`https://www.googleapis.com/drive/v3/files/${id}`);
            url.search = new URLSearchParams({supportsAllDrives: 'true', fields: 'id,mimeType,driveId,parents,trashed,capabilities(canListChildren,canAddChildren,canDeleteChildren)'});
            const response = await fetch(url, {headers: {Authorization: `Bearer ${process.env.DRIVE_TOKEN}`}});
            if (!response.ok) throw new Error(`Drive metadata status ${response.status}`);
            folders.push(await response.json());
          }
          writeFileSync('visual-folder-access.json', JSON.stringify(folders, null, 2));
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: visual-folder-access
          path: visual-folder-access.json
          retention-days: 1
          if-no-files-found: error
