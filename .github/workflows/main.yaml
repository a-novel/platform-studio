name: main

on:
  merge_group:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  lint-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          lint_action: "lint:ci"

  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/generic-actions/lint-dockerfile@v1.31.0
        with:
          version: "2.14.0"

  test-unit:
    needs: [lint-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.31.0
        id: test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          test_action: "test:unit"
          coverage_artifact: unitcover
          coverage_file: coverage/unit/lcov.info

  test-browser:
    needs: [lint-node]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: studio-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser component tests
        run: pnpm run test:browser
      - uses: actions/upload-artifact@v7
        id: test
        with:
          name: browsercover
          path: coverage/browser/lcov.info
          if-no-files-found: error
      - name: Run live browser journeys
        run: pnpm run test:e2e
      - name: Collect service logs
        if: always()
        run: |
          if [ ! -f integration-services.log ]; then
            docker compose --file builds/compose.e2e.yaml logs --no-color > integration-services.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-browser-report
          path: |
            playwright-report/
            test-results/
            integration-services.log
          retention-days: 7
      - name: Remove integration services and data
        if: always()
        run: docker compose --file builds/compose.e2e.yaml down --volumes --remove-orphans

  test-storybook:
    needs: [lint-node]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
      - name: Run Storybook interaction and accessibility tests
        run: pnpm run test:storybook

  report-codecov:
    runs-on: ubuntu-latest
    needs: [test-unit, test-browser]
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.31.0
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          coverage_files: unitcover/lcov.info,browsercover/lcov.info
          coverage_artifact_ids: ${{ needs.test-unit.outputs.artifact-id }},${{ needs.test-browser.outputs.artifact-id }}

  audit-node:
    needs: [lint-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
      - name: Audit production and development dependencies
        run: pnpm run audit

  build-node:
    needs: [lint-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
          build_action: "build:ci"

  build-platform:
    needs: [lint-dockerfile, build-node]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.31.0
        with:
          file: Dockerfile
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
