name: studio-e2e

x-postgres-environment: &postgres-environment
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  POSTGRES_INITDB_ARGS: --auth=scram-sha-256

# Stands in for the cluster's service-account issuer, so Authentication tells its callers apart as in production.
x-service-token-issuer: &service-token-issuer http://service-token-issuer:8080

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready", "-U", "postgres"]
  interval: 1s
  timeout: 5s
  retries: 30

services:
  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.25.4@sha256:eacb92cda967cca5fd86c5b13d652cb4b6de3ba66794c7ceb7428b62970831e1
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.15.8@sha256:59cc97cda142289a494eadac04a48da83243ccb4a4975f07e08361627dfb9ae2
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  postgres-profile:
    image: ghcr.io/a-novel/service-profile/database:v1.1.0@sha256:76b689469848223dee4198144d423f6f5b12807e17c436cbcbb1d81955869f81
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  mailserver:
    image: ghcr.io/axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:14825:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.15.8@sha256:706896ffd74bb4172dff1e80771a217b463dad8af5942e2858998677eb213dfb
    healthcheck:
      test: ["CMD", "grpcurl", "--plaintext", "-d", "", "localhost:8080", "grpc.health.v1.Health/Check"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca

  # JSON keys' public API, whose keys verify access tokens on Studio.
  json-keys-rest:
    image: ghcr.io/a-novel/service-json-keys/rest:v2.15.8@sha256:c4860fc45c1823816a1fb8088d33c73971ab9cc70fe1ee4d272241e72d59d1b8
    ports:
      - "127.0.0.1:14103:8080"
    # The gRPC server's start migrates the database and creates the keys this server lists.
    depends_on:
      service-json-keys:
        condition: service_healthy
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"

  service-token-issuer:
    image: ghcr.io/a-novel/service-authentication/service-token-issuer:v2.25.4@sha256:6e74b2cd9752162a59cae69368f949361309c55a66160e9137576d91ed7ff78a
    ports:
      - "127.0.0.1:14101:8080"
    environment:
      SERVICE_TOKEN_ISSUER: *service-token-issuer
    # Podman ignores the image's own check, so the wait of authentication needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Holds the network authentication joins, so the outage journey's restart leaves the host's
  # interfaces alone. A new interface makes Chromium abort loading pages with ERR_NETWORK_CHANGED.
  authentication-network:
    image: registry.k8s.io/pause:3.10.2
    ports:
      - "127.0.0.1:14100:8080"

  authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.25.4@sha256:e53dd6cd1c7af0419def5a4b95b1dd5852bf55a221076bf17ab5814d9c7ffec1
    network_mode: service:authentication-network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
      service-token-issuer:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email admin@studio.test --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      # Email links open the account platform, which serves every account form.
      PLATFORM_AUTH_URL: http://127.0.0.1:14102
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Studio integration tests
      SMTP_SENDER_EMAIL: noreply@studio.test
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
      # Every journey comes from one address and mints its own anonymous session.
      REST_RATE_LIMITS_ENABLED: "false"
      SERVICE_TOKEN_ISSUER: *service-token-issuer
      SERVICE_TOKEN_AUDIENCE: authentication
      SERVICE_TOKEN_CALLERS: system:serviceaccount:account:web,system:serviceaccount:studio:web
      # Studio as production registers it, on the address of the journeys' Studio server.
      OAUTH_CLIENTS: >-
        {"studio": {"redirectURI": "http://127.0.0.1:4173/auth/callback",
        "caller": "system:serviceaccount:studio:web"}}

  # The account platform, where Studio signs people in.
  profile:
    image: ghcr.io/a-novel/service-profile/standalone-rest:v1.1.0@sha256:bc24e03176999fb8f5ef62079fb07fd44fe478ec35972027ebb5049f145b63f5
    ports:
      - "127.0.0.1:14104:8080"
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v1/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-profile:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      service-token-issuer:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-profile
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      # As in production: the visitor's address comes from the platform, not from the connection.
      REST_CLIENT_IP_HEADER: X-Client-IP
      # Every journey comes from one address, and each page load reads the profile.
      REST_RATE_LIMITS_ENABLED: "false"
      SERVICE_TOKEN_ISSUER: *service-token-issuer
      SERVICE_TOKEN_AUDIENCE: profile
      SERVICE_TOKEN_CALLERS: system:serviceaccount:account:web,system:serviceaccount:studio:web

  account:
    image: ghcr.io/a-novel/platform-account:v1.7.6@sha256:bd2652da90cddf4d10161cb178bfc0def8c5a25c1de7206912552506a3625d5c
    ports:
      - "127.0.0.1:14102:3000"
    depends_on:
      authentication:
        condition: service_healthy
      profile:
        condition: service_healthy
    # The platform reads its service token from a file, as a pod reads its projected token. A token
    # lasts an hour, longer than a run.
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/service-token
        "http://service-token-issuer:8080/token?subject=system:serviceaccount:account:web&audience=authentication" &&
        wget -qO /tmp/profile-service-token
        "http://service-token-issuer:8080/token?subject=system:serviceaccount:account:web&audience=profile" &&
        exec node build
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      AUTHENTICATION_SERVICE_URL: http://authentication-network:8080
      JSON_KEYS_SERVICE_URL: http://json-keys-rest:8080
      PROFILE_SERVICE_TOKEN_PATH: /tmp/profile-service-token
      PROFILE_SERVICE_URL: http://profile:8080
      SERVICE_TOKEN_PATH: /tmp/service-token
      # The platform derives its origin, which its form posts and its issuer use, from each request,
      # over https unless this header names another protocol. The journeys' browser sends it.
      PROTOCOL_HEADER: x-forwarded-proto
      STUDIO_URL: http://127.0.0.1:4173
      # The issuer answers 404 at once, which the platform reads as no planned downtime.
      DOWNTIME_URL: http://service-token-issuer:8080/downtime.json

  postgres-genai:
    image: ghcr.io/a-novel/service-genai/database:v0.11.1@sha256:cbe7de0770951c90041857e59d3775f1b1ea86fa2b69b7858350017e083dc645
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  # The narrative engine reaches genai for its health check alone here: the journeys submit no generation.
  service-genai:
    image: ghcr.io/a-novel/service-genai/standalone-grpc:v0.11.1@sha256:e3cd128e5ae53141c44005dc183095e2925169759735791863c5151d6a038859
    depends_on:
      postgres-genai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpcurl", "--plaintext", "-d", "", "localhost:8080", "grpc.health.v1.Health/Check"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
      # A closed port: a model call fails before it reaches any provider.
      OPENAI_BASE_URL: "http://127.0.0.1:1/v1"
      OPENAI_API_KEY: test-only

  postgres-narrative-engine:
    image: ghcr.io/a-novel/service-narrative-engine/database:v1.6.0@sha256:0a3f5dc688cb2cd68055453c3249695cf5259574df1a499fa6ba930a0c32425f
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  # The narrative engine, which stores the writers' projects Studio lists.
  narrative-engine:
    image: ghcr.io/a-novel/service-narrative-engine/standalone-rest:v1.6.0@sha256:150c42ef78a4fa033df6fd5e97ff069327e8ee8ce5888648342cbab409c92256
    ports:
      - "127.0.0.1:14105:8080"
    depends_on:
      postgres-narrative-engine:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      service-genai:
        condition: service_healthy
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v1/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-narrative-engine:5432/postgres?sslmode=disable
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      SERVICE_GENAI_HOST: service-genai
      SERVICE_GENAI_PORT: 8080
      # Every journey comes from one address.
      REST_RATE_LIMITS_ENABLED: "false"
